# -----------------------------------------
# Engine 共用設定
# -----------------------------------------
# 預設 profile = local（H2，適合 IntelliJ 本機先跑通）。
# Docker 全棧請設 SPRING_PROFILES_ACTIVE=docker（見 docker-compose.yml）。
# -----------------------------------------

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: trading-engine
  profiles:
    default: local
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:trading-engine}
    listener:
      # 預設關閉；local 亦為 false。docker profile 會改 true（見 application-docker.yml）
      # 注意：自訂 ListenerContainerFactory 還需在 Java 裡 setAutoStartup（KafkaConsumerConfig）
      auto-startup: false

trading:
  risk:
    max-position-per-symbol: 100
    max-total-exposure: 1000000
    duplicate-window-seconds: 60
    default-volatility-index: 0.30
    extreme-volatility-index: 0.95
    max-volatility-index: 0.80
    overtrading-window-seconds: 60
    max-orders-per-window: 200
    partial-fill-threshold: 10
    partial-fill-ratio: 0.50
    min-trend-strength: 0.40
    max-signal-noise: 0.70
    reduce-volatility-threshold: 0.65
    volatility-reduce-ratio: 0.50
    discipline-order-threshold: 30
  job:
    stale-order:
      enabled: ${JOB_STALE_ORDER_ENABLED:true}
      timeout-seconds: ${JOB_STALE_ORDER_TIMEOUT_SECONDS:300}
      batch-size: 200
      cron: ${JOB_STALE_ORDER_CRON:0 */5 * * * *}
    pnl-snapshot:
      enabled: ${JOB_PNL_SNAPSHOT_ENABLED:true}
      cron: ${JOB_PNL_SNAPSHOT_CRON:0 0 0 * * *}
    retry:
      enabled: ${JOB_RETRY_ENABLED:true}
      max-attempts: 3
      backoff-seconds: 30
      batch-size: 100
      cron: ${JOB_RETRY_CRON:0 * * * * *}
    cleanup:
      enabled: ${JOB_CLEANUP_ENABLED:true}
      event-retention-days: 30
      failed-command-retention-days: 7
      batch-size: 500
      cron: ${JOB_CLEANUP_CRON:0 30 0 * * *}
  cors:
    allowed-origins: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: trading-engine
      instance: ${HOSTNAME:local}

# IntelliJ／bootRun 就緒後 Console 印常用 URL（見 StartupInfoLogger）
startup:
  info:
    enabled: true
    project-name: APIGatewayMQ Engine
    frontend: none
    auth: false
    h2: false
    api-docs: true
    # Console「全棧服務連結」預設埠（對齊 docker-compose／規格書）
    gateway-url: http://localhost:8080
    engine-url: http://localhost:8081
    prometheus-url: http://localhost:9090
    grafana-url: http://localhost:3000
    extra-paths:
      - /api/v1/orders
      - /api/v1/positions
      - /api/v1/pnl

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.trading.engine: INFO
    com.trading.application: INFO
    com.trading.engine.job: INFO
    org.apache.kafka: WARN
