spring.application.name=trading-engine-test

spring.datasource.url=jdbc:h2:mem:agmqtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers:localhost:9092}
spring.kafka.consumer.group-id=test-engine
spring.kafka.consumer.auto-offset-reset=earliest
# 主設定預設 auto-startup=false（本機無 broker）；EmbeddedKafka 整合測試必須開 listener
spring.kafka.listener.auto-startup=true

trading.risk.max-position-per-symbol=100
trading.risk.max-total-exposure=1000000
trading.risk.duplicate-window-seconds=60
trading.risk.default-volatility-index=0.30
trading.risk.extreme-volatility-index=0.95
trading.risk.max-volatility-index=0.80
trading.risk.overtrading-window-seconds=60
trading.risk.max-orders-per-window=200
trading.risk.partial-fill-threshold=10
trading.risk.partial-fill-ratio=0.50
trading.risk.min-trend-strength=0.40
trading.risk.max-signal-noise=0.70
trading.risk.reduce-volatility-threshold=0.65
trading.risk.volatility-reduce-ratio=0.50
trading.risk.discipline-order-threshold=30

# 測試環境關閉排程觸發器，改由測試直接呼叫 Service 方法驗證，避免非預期干擾
trading.job.stale-order.enabled=false
trading.job.stale-order.timeout-seconds=300
trading.job.stale-order.batch-size=200
trading.job.pnl-snapshot.enabled=false
trading.job.retry.enabled=false
trading.job.retry.max-attempts=3
trading.job.retry.backoff-seconds=30
trading.job.retry.batch-size=100
trading.job.cleanup.enabled=false
trading.job.cleanup.event-retention-days=30
trading.job.cleanup.failed-command-retention-days=7
trading.job.cleanup.batch-size=500
