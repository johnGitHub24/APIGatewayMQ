server:
  port: 8080

spring:
  application:
    name: trading-gateway
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gateway:
  engine-uris:
    - ${ENGINE_URI_1:http://localhost:8081}
    - ${ENGINE_URI_2:http://localhost:8082}
  rate-limit-per-second: ${GATEWAY_RATE_LIMIT:50}
  instance-id: ${GATEWAY_INSTANCE_ID:gateway-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: trading-gateway

# IntelliJ／bootRun 就緒後 Console 印常用 URL（見 StartupInfoLogger）
startup:
  info:
    enabled: true
    project-name: APIGatewayMQ Gateway
    frontend: none
    auth: false
    h2: false
    api-docs: true
    probe: true
    # Console「全棧服務連結」預設埠（對齊 docker-compose／規格書）
    gateway-url: http://localhost:8080
    engine-url: http://localhost:8081
    prometheus-url: http://localhost:9090
    grafana-url: http://localhost:3000
    extra-paths:
      - /api/v1/orders
      - /actuator/prometheus

logging:
  level:
    com.trading.gateway: INFO
    org.apache.kafka: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
