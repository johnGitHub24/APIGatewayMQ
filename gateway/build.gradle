plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.3.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
}

bootJar {
    archiveBaseName = 'trading-gateway'
}

def testJvmArgs = ['-Djdk.attach.allowAttachSelf=true']

tasks.named('test') {
    description = 'Runs unit tests (excludes @Tag integration)'
    workingDir = rootProject.projectDir
    maxParallelForks = 1
    minHeapSize = "128m"
    maxHeapSize = "384m"
    jvmArgs = testJvmArgs
    useJUnitPlatform {
        excludeTags 'integration', 'openapi'
    }
}

tasks.register('exportOpenApi', Test) {
    description = 'Exports live OpenAPI YAML to docs/openapi-gateway-live.yaml'
    group = 'documentation'
    workingDir = rootProject.projectDir
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'openapi'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests (@Tag integration)'
    group = 'verification'
    workingDir = rootProject.projectDir
    maxParallelForks = 1
    jvmArgs = testJvmArgs
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
