# -----------------------------------------
# Prometheus 基本設定（初學者導讀）
# -----------------------------------------
# 這份檔案告訴 Prometheus「要去哪裡抓 metrics」。
# 專案目前抓 3 個目標：
# 1) gateway
# 2) engine-1
# 3) engine-2
#
# 注意：
# - 這裡的主機名（gateway / engine-1 / engine-2）是 docker compose 服務名
# - metrics 端點使用 Spring Boot Actuator 的 /actuator/prometheus

global:
  # 每 15 秒抓一次指標（新手先用預設即可）
  # 若要更即時可改小（例如 5s），但監控負載也會增加。
  scrape_interval: 15s

scrape_configs:
  # -----------------------------------------
  # Gateway 指標
  # -----------------------------------------
  # job_name：Prometheus 內部工作名稱，會出現在查詢標籤 job=""
  - job_name: trading-gateway
    # Spring Boot 暴露 Prometheus 指標的路徑
    metrics_path: /actuator/prometheus
    static_configs:
      # 目標位址格式：<service-name>:<port>
      # 這裡是在 docker network 內連到 gateway 容器
      - targets: ["gateway:8080"]

  # -----------------------------------------
  # Engine #1 指標
  # -----------------------------------------
  - job_name: trading-engine-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["engine-1:8081"]
        labels:
          # 自訂標籤：方便 Grafana / PromQL 區分不同副本
          replica: engine-1

  # -----------------------------------------
  # Engine #2 指標
  # -----------------------------------------
  - job_name: trading-engine-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["engine-2:8081"]
        labels:
          # 與 engine-1 相同指標格式，但用 replica 區分來源
          replica: engine-2
