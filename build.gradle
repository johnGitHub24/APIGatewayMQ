plugins {
    id 'java'
    id 'base'
    id 'org.springframework.boot' version '3.2.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.trading'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.2'
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

tasks.register('checkAll') {
    group = 'verification'
    description = 'Runs check on common, gateway, and engine (sequential)'
    dependsOn ':common:check', ':gateway:check', ':engine:check'
    mustRunAfter ':common:check'
}

tasks.register('exportOpenApi') {
    group = 'documentation'
    description = 'Exports springdoc YAML to docs/openapi-*-live.yaml'
    dependsOn ':engine:exportOpenApi', ':gateway:exportOpenApi'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
