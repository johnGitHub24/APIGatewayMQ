openapi: 3.0.3
info:
  title: APIGatewayMQ API
  description: |
    高併發交易系統完整 API 規格（Gateway + Engine）。

    ## 架構
    - **Gateway** (`:8080`)：非同步下單 202、限流、查詢代理
    - **Engine** (`:8081`)：同步下單 201、風控、持倉、PnL

    ## 下單方式
    | 路徑 | Gateway | Engine 直連 |
    |------|---------|-------------|
    | `POST /api/v1/orders` | 202 Accepted → Kafka | 201 Created → 即時風控成交 |

    ## 子規格檔
    - `docs/openapi-gateway.yaml` — Gateway 專用
    - `docs/openapi-engine.yaml` — Engine 完整端點

    ## 執行期匯出（Engine springdoc）
    ```powershell
    curl http://localhost:8081/v3/api-docs.yaml -o docs/openapi-engine-live.yaml
    ```
  version: v1

servers:
  - url: http://localhost:8080
    description: API Gateway（建議對外入口）
  - url: http://localhost:8081
    description: Trading Engine（開發/除錯直連）

tags:
  - name: Gateway — Async Orders
    description: 僅 Gateway 提供（202 + Kafka）
  - name: Orders
  - name: Trades
  - name: Positions
  - name: PnL

paths:
  /api/v1/orders:
    post:
      tags: [Gateway — Async Orders, Orders]
      summary: 提交訂單
      description: |
        **Gateway (`:8080`)**：非同步，回 `202` + `OrderAcceptedResponse`，訊息進 Kafka。
        **Engine (`:8081`)**：同步，回 `201` + `OrderResponse`，立即風控與成交。
      operationId: submitOrder
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              symbol: BTCUSDT
              side: BUY
              quantity: 0.5
              price: 65000
      responses:
        '201':
          description: Engine 同步下單成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '202':
          description: Gateway 非同步已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderAcceptedResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/DuplicateOrder'
        '422':
          $ref: '#/components/responses/RiskRejected'
        '429':
          description: Gateway 限流（僅 Gateway）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitError'
        '503':
          description: Gateway Kafka 發送失敗
    get:
      tags: [Orders]
      summary: 查詢訂單列表或依 clientOrderId 查單筆
      operationId: listOrLookupOrders
      parameters:
        - name: symbol
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: clientOrderId
          in: query
          description: Gateway 非同步下單後輪詢用
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分頁列表或單筆訂單
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PagedOrderResponse'
                  - $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      summary: 查詢單筆訂單
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/orders/{orderId}/events:
    get:
      tags: [Orders]
      summary: 訂單審計事件
      operationId: getOrderEvents
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderEventsResponse'

  /api/v1/orders/{orderId}/fill:
    post:
      tags: [Orders]
      summary: 補足部分成交
      operationId: completeFill
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '422':
          $ref: '#/components/responses/InvalidOrderState'

  /api/v1/orders/{orderId}/cancel:
    patch:
      tags: [Orders]
      summary: 取消訂單
      operationId: cancelOrder
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '422':
          $ref: '#/components/responses/InvalidOrderState'

  /api/v1/trades:
    get:
      tags: [Trades]
      summary: 成交列表
      operationId: listTrades
      parameters:
        - name: orderId
          in: query
          schema:
            type: integer
            format: int64
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTradeResponse'

  /api/v1/trades/{tradeId}:
    get:
      tags: [Trades]
      summary: 單筆成交
      operationId: getTrade
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TradeDetailResponse'

  /api/v1/positions:
    get:
      tags: [Positions]
      summary: 持倉列表
      operationId: listPositions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPositionResponse'

  /api/v1/positions/{symbol}:
    get:
      tags: [Positions]
      summary: 單一標的持倉
      operationId: getPosition
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionResponse'

  /api/v1/pnl:
    get:
      tags: [PnL]
      summary: PnL 摘要
      operationId: getPnL
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PnLResponse'

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100

  responses:
    ValidationError:
      description: 驗證失敗
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemError'
    RiskRejected:
      description: 風控拒絕
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemError'
    DuplicateOrder:
      description: 冪等鍵重複
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemError'
    InvalidOrderState:
      description: 狀態不允許
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemError'
    NotFound:
      description: 不存在
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemError'

  schemas:
    OrderSide:
      type: string
      enum: [BUY, SELL]
    OrderStatus:
      type: string
      enum: [NEW, PARTIALLY_FILLED, FILLED, REJECTED, CANCELLED]
    OrderEventType:
      type: string
      enum:
        - RECEIVED
        - RISK_CHECK
        - APPROVED
        - REJECTED
        - PARTIALLY_FILLED
        - FILLED
        - CANCELLED
        - OUTCOME_RECORDED
        - DISCIPLINE_FLAG
        - POSITION_UPDATED

    CreateOrderRequest:
      type: object
      required: [symbol, side, quantity, price]
      properties:
        clientOrderId:
          type: string
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
        price:
          type: number

    OrderAcceptedResponse:
      type: object
      description: Gateway 202 回應
      properties:
        commandId:
          type: string
          format: uuid
        clientOrderId:
          type: string
        status:
          type: string
          example: ACCEPTED
        message:
          type: string
        pollUrl:
          type: string
        acceptedAt:
          type: string
          format: date-time

    RateLimitError:
      type: object
      properties:
        errorCode:
          type: string
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string

    OrderResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        clientOrderId:
          type: string
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          type: number
        filledQuantity:
          type: number
        price:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        rejectReason:
          type: string
        riskRuleCode:
          type: string
        trades:
          type: array
          items:
            $ref: '#/components/schemas/TradeResponse'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TradeResponse:
      type: object
      properties:
        executedPrice:
          type: number
        executedQty:
          type: number
        executedAt:
          type: string
          format: date-time

    TradeDetailResponse:
      type: object
      properties:
        tradeId:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        executedPrice:
          type: number
        executedQty:
          type: number
        executedAt:
          type: string
          format: date-time

    OrderEventsResponse:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
        events:
          type: array
          items:
            type: object
            properties:
              event:
                $ref: '#/components/schemas/OrderEventType'
              riskRuleCode:
                type: string
              rejectReason:
                type: string
              createdAt:
                type: string
                format: date-time

    PositionResponse:
      type: object
      properties:
        symbol:
          type: string
        quantity:
          type: number
        avgPrice:
          type: number
        unrealizedPnl:
          type: number
        updatedAt:
          type: string
          format: date-time

    PnLResponse:
      type: object
      properties:
        totalUnrealizedPnl:
          type: number
        asOf:
          type: string
          format: date-time
        positions:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              unrealizedPnl:
                type: number

    PageMeta:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
          format: int64
        totalPages:
          type: integer

    PagedOrderResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PagedTradeResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TradeDetailResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'

    PagedPositionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PositionResponse'
        meta:
          $ref: '#/components/schemas/PageMeta'

    ProblemError:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errorCode:
          type: string
        ruleCode:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
