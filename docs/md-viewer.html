<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <!--
    eos-minimal md-viewer（驗證試點：TradingHighConcurrency）
    必須用 HTTP 開啟（專案根目錄 python -m http.server），file:// 無法 fetch .md。
    用法：docs/md-viewer.html?src=architecture.md
         docs/md-viewer.html?src=../規格書.md
  -->
  <style>
    :root {
      --bg: #0f1419; --surface: #1a2332; --border: #2d3a4f;
      --text: #e6edf3; --muted: #8b9cb3; --accent: #3b82f6; --accent2: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.65;
    }
    .bar {
      position: sticky; top: 0; z-index: 10;
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem;
      padding: 0.75rem 1.25rem; background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .bar a { color: var(--accent); text-decoration: none; font-size: 0.9rem; }
    .bar a:hover { text-decoration: underline; }
    .bar .path { color: var(--muted); font-size: 0.85rem; word-break: break-all; }
    .bar .badge {
      font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid var(--border); color: var(--accent2);
    }
    main { max-width: 880px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .md h1, .md h2, .md h3 { border-bottom: 1px solid var(--border); padding-bottom: 0.35rem; }
    .md h1 { font-size: 1.75rem; } .md h2 { font-size: 1.35rem; margin-top: 1.75rem; }
    .md h3 { font-size: 1.1rem; margin-top: 1.25rem; color: var(--accent); border-bottom: none; }
    .md p, .md li { color: #c9d4e3; }
    .md a { color: var(--accent); }
    .md code {
      background: #0d1117; padding: 0.12rem 0.35rem; border-radius: 4px;
      color: #79c0ff; font-size: 0.88em;
    }
    .md pre {
      background: #0d1117; border: 1px solid var(--border); border-radius: 8px;
      padding: 1rem; overflow-x: auto;
    }
    .md pre code { padding: 0; background: none; color: #a5d6ff; }
    .md table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin: 1rem 0; }
    .md th, .md td { border: 1px solid var(--border); padding: 0.45rem 0.65rem; text-align: left; }
    .md th { background: #243044; color: var(--accent); }
    .md blockquote {
      margin: 1rem 0; padding: 0.5rem 1rem; border-left: 3px solid var(--accent);
      background: #243044; color: var(--muted);
    }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
    .md .mermaid {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 1rem; margin: 1rem 0;
    }
    .err, .hint {
      background: #243044; border-left: 3px solid #f59e0b;
      padding: 1rem 1.1rem; border-radius: 0 8px 8px 0; margin: 1rem 0;
    }
    .err { border-left-color: #ef4444; }
    .hint code, .err code {
      display: block; margin-top: 0.5rem; padding: 0.75rem;
      background: #0d1117; border-radius: 6px; color: #a5d6ff; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="bar">
    <a id="back" href="codeGraphic.html">← CodeGraphic</a>
    <span class="badge">Markdown Viewer</span>
    <span class="path" id="pathLabel">載入中…</span>
  </div>
  <main>
    <div id="hint" class="hint" hidden></div>
    <article id="content" class="md"></article>
  </main>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const src = params.get("src") || params.get("f");
      const pathLabel = document.getElementById("pathLabel");
      const content = document.getElementById("content");
      const hint = document.getElementById("hint");

      if (!src) {
        pathLabel.textContent = "未指定檔案";
        content.innerHTML = "<div class='err'>請使用 <code>md-viewer.html?src=architecture.md</code></div>";
        return;
      }
      if (/^https?:\/\//i.test(src) || src.includes("://") || src.includes("\\")) {
        pathLabel.textContent = "拒絕的路徑";
        content.innerHTML = "<div class='err'>只允許相對路徑的 Markdown 檔。</div>";
        return;
      }

      pathLabel.textContent = src;
      document.title = decodeURIComponent(src.split("/").pop()) + " — Markdown Viewer";

      function resolveRel(baseSrc, href) {
        const stack = baseSrc.split("/").slice(0, -1);
        href.split("/").forEach((p) => {
          if (p === "..") stack.pop();
          else if (p && p !== ".") stack.push(p);
        });
        return stack.join("/");
      }

      function rewriteMdLinks(baseSrc) {
        content.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href");
          if (!href || /^https?:\/\//i.test(href) || href.startsWith("#") || href.startsWith("mailto:")) return;
          if (!/\.md($|#|\?)/i.test(href)) return;
          const pathOnly = href.split("#")[0].split("?")[0];
          const hash = href.includes("#") ? "#" + href.split("#").slice(1).join("#") : "";
          const resolved = resolveRel(baseSrc, pathOnly);
          a.setAttribute("href", "md-viewer.html?src=" + encodeURIComponent(resolved) + hash);
        });
      }

      async function render(text) {
        marked.setOptions({ gfm: true, breaks: false });
        content.innerHTML = DOMPurify.sanitize(marked.parse(text), { ADD_ATTR: ["target"] });
        rewriteMdLinks(src);
        content.querySelectorAll("pre code.language-mermaid").forEach((code) => {
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = code.textContent;
          code.parentElement.replaceWith(div);
        });
        if (window.mermaid && content.querySelector(".mermaid")) {
          mermaid.initialize({ startOnLoad: false, theme: "dark", securityLevel: "loose" });
          await mermaid.run({ nodes: content.querySelectorAll(".mermaid") });
        }
      }

      if (location.protocol === "file:") {
        hint.hidden = false;
        hint.innerHTML =
          "<strong>請勿用 file:// 直接開</strong>。瀏覽器無法讀取同目錄 .md。<br/>" +
          "在<strong>專案根目錄</strong>執行後再開瀏覽器：<code>python -m http.server 8765</code>" +
          "然後開啟 <code>http://localhost:8765/docs/codeGraphic.html</code>" +
          "<br/>或執行 <code>scripts\\open-codeGraphic.ps1</code>（若專案有提供）。";
        content.innerHTML = "";
        return;
      }

      fetch(src)
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status + " — 若連結含 ../，請確認伺服器是從<strong>專案根目錄</strong>啟動，不是 docs/");
          return r.text();
        })
        .then(render)
        .catch((e) => {
          content.innerHTML =
            "<div class='err'>無法載入 <code>" + src.replace(/</g, "&lt;") +
            "</code><br/>" + String(e.message || e) +
            "<code>cd &lt;專案根&gt;\npython -m http.server 8765\n# 開 http://localhost:8765/docs/md-viewer.html?src=...</code></div>";
        });
    })();
  </script>
</body>
</html>
